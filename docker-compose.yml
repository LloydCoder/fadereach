name: fadereach

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: production
      APP_URL: https://fadereach.app
      DATABASE_URL: postgresql://fadereach_runtime:${POSTGRES_RUNTIME_PASSWORD}@postgres:5432/fadereach_meta
      MIGRATION_DATABASE_URL: postgresql://fadereach:${POSTGRES_PASSWORD}@postgres:5432/fadereach_meta
      JWT_SECRET: ${JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      REDIS_URL: redis://redis:6379/0
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      ZEROBOUNCE_API_KEY: ${ZEROBOUNCE_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      FADEREACH_API_URL: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /opt/fadereach/tenants:/opt/fadereach/tenants
    networks: [fadereach-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [fadereach-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: fadereach_meta
      POSTGRES_USER: fadereach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks: [fadereach-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fadereach -d fadereach_meta"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [fadereach-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    image: n8nio/n8n:2.38.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: n8n.fadereach.app
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.fadereach.app/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: fadereach
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      FADEREACH_API_URL: http://api:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [fadereach-net]

  listmonk-internal:
    image: listmonk/listmonk:v6.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9000"
    environment:
      LISTMONK_db__host: postgres
      LISTMONK_db__port: 5432
      LISTMONK_db__user: fadereach
      LISTMONK_db__password: ${POSTGRES_PASSWORD}
      LISTMONK_db__database: listmonk_internal
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_app__admin_username: lloyd
      LISTMONK_app__admin_password: ${LISTMONK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - listmonk_uploads:/listmonk/static/uploads
    networks: [fadereach-net]

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  listmonk_uploads:

networks:
  fadereach-net:
    driver: bridge
