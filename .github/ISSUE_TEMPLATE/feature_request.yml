name: Feature request
description: Propose a focused improvement to FadeReach.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who has the problem and what outcome is currently missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security, tenancy, compliance, or operational impact
      description: Identify affected boundaries, data, providers, or migrations.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Give testable conditions for completion.
    validations:
      required: true
