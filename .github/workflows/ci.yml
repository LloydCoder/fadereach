name: FadeReach CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fadereach-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend compile, migration, RLS and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine3.24
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fadereach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fadereach_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4.11-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Verify Alembic migration chain
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fadereach_test
          DATABASE_URL: postgresql://fadereach_runtime:runtime-password@localhost:5432/fadereach_test
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d fadereach_test -v ON_ERROR_STOP=1 -c "CREATE ROLE fadereach_runtime LOGIN PASSWORD 'runtime-password'; CREATE ROLE fadereach_worker LOGIN BYPASSRLS PASSWORD 'worker-password';"
          cd .. && alembic upgrade head
          PGPASSWORD=postgres psql -h localhost -U postgres -d fadereach_test -c "SELECT relrowsecurity FROM pg_class WHERE relname = 'campaigns';" | grep -q t
          PGPASSWORD=postgres psql -h localhost -U postgres -d fadereach_test -c "SELECT rolbypassrls FROM pg_roles WHERE rolname = 'fadereach_worker';" | grep -q t
          PGPASSWORD=postgres psql -h localhost -U postgres -d fadereach_test -c "SELECT has_table_privilege('fadereach_worker','execution_jobs','SELECT,UPDATE');" | grep -q t
          PGPASSWORD=postgres psql -h localhost -U postgres -d fadereach_test -c "SELECT has_table_privilege('fadereach_worker','tenant_data_policies','SELECT');" | grep -q t
          PGPASSWORD=postgres psql -h localhost -U postgres -d fadereach_test -c "SELECT has_table_privilege('fadereach_worker','leads','DELETE');" | grep -q t
      - name: Verify tenant RLS isolation
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d fadereach_test -v ON_ERROR_STOP=1 -c "INSERT INTO tenants (id,email,name,password_hash) VALUES ('ci-tenant-a','a@example.test','Tenant A','test'), ('ci-tenant-b','b@example.test','Tenant B','test') ON CONFLICT (id) DO NOTHING;"
          PGPASSWORD=runtime-password psql -h localhost -U fadereach_runtime -d fadereach_test -v ON_ERROR_STOP=1 -c "SELECT set_config('app.tenant_id','ci-tenant-a',false); INSERT INTO campaigns (tenant_id,name,subject) VALUES ('ci-tenant-a','RLS test','RLS test');"
          PGPASSWORD=runtime-password psql -h localhost -U fadereach_runtime -d fadereach_test -v ON_ERROR_STOP=1 -c "SELECT set_config('app.tenant_id','ci-tenant-b',false); SELECT COUNT(*) FROM campaigns WHERE tenant_id='ci-tenant-a';" | grep -E "[[:space:]]0$"
      - name: Import application and run tests
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          DATABASE_URL: postgresql://fadereach_runtime:runtime-password@localhost:5432/fadereach_test
          REDIS_URL: redis://localhost:6379/0
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fadereach_test
        run: |
          python -c "from main import app; print('routes', len(app.routes))"
          PYTHONPATH=. pytest -q tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: |
          cat > .env.ci <<'EOF'
          POSTGRES_PASSWORD=ci-password
          JWT_SECRET=ci-jwt-secret-at-least-32-characters
          CREDENTIAL_ENCRYPTION_KEY=ci-credential-key-at-least-32-characters
          UNSUBSCRIBE_SECRET=ci-unsubscribe-secret-at-least-32-characters
          POSTGRES_RUNTIME_PASSWORD=ci-runtime-password
          POSTGRES_WORKER_PASSWORD=ci-worker-password
          N8N_DB_PASSWORD=ci-n8n-db-password
          LISTMONK_DB_PASSWORD=ci-listmonk-db-password
          LISTMONK_ADMIN_PASSWORD=ci-password
          N8N_ENCRYPTION_KEY=ci-n8n-key-at-least-32-characters
          EOF
      - run: |
          docker compose --env-file .env.ci config --quiet
          docker compose --env-file .env.ci build api worker frontend

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: |
          bash -n infrastructure/setup.sh
          bash -n infrastructure/provision_tenant.sh
          bash -n infrastructure/postgres/init/01-databases.sh
          bash -n scripts/ec2_app_setup.sh
          bash -n ops/backup_postgres.sh
          bash -n ops/restore_postgres.sh
          bash -n ops/smoke_test.sh


  security:
    name: Security static and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Bandit high-severity scan
        run: pip install bandit==1.9.4 && bandit -r . -x ./tests -lll
      - name: Dependency vulnerability audit
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt


  supply_chain:
    name: Supply-chain SBOM evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate Python SBOM
        run: |
          python -m pip install --disable-pip-version-check cyclonedx-bom==7.5.0
          cyclonedx-py requirements backend/requirements.txt -o backend-sbom.json --of JSON
      - name: Validate SBOM
        run: |
          python - <<'PY'
          import json
          with open("backend-sbom.json", encoding="utf-8") as handle:
              bom = json.load(handle)
          assert bom["bomFormat"] == "CycloneDX"
          assert bom["specVersion"]
          assert isinstance(bom.get("components"), list)
          PY
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fadereach-python-sbom
          path: backend-sbom.json
          if-no-files-found: error
          retention-days: 90
