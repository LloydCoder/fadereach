name: FadeReach CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fadereach-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend compile and import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fadereach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fadereach_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Verify Alembic migration chain
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fadereach_test
        run: cd .. && alembic upgrade head
      - name: Import application
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci-test-secret
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
        run: python -c "from main import app; print('routes', len(app.routes))"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > .env.ci <<'EOF'
          POSTGRES_PASSWORD=ci-password
          JWT_SECRET=ci-jwt-secret
          LISTMONK_ADMIN_PASSWORD=ci-password
          N8N_ENCRYPTION_KEY=ci-key
          EOF
      - run: docker compose --env-file .env.ci config --quiet

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n infrastructure/setup.sh
          bash -n infrastructure/provision_tenant.sh
          bash -n scripts/ec2_app_setup.sh
