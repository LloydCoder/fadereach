name: FadeReach — Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fadereach-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production host
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate deployment configuration
        run: |
          test -f docker-compose.yml
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f frontend/nginx.conf
          test -f infrastructure/postgres/init/01-databases.sh

      - name: Verify Compose configuration
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_RUNTIME_PASSWORD=ci-runtime-password
          N8N_DB_PASSWORD=ci-n8n-db-password
          LISTMONK_DB_PASSWORD=ci-listmonk-db-password
          JWT_SECRET=ci-jwt-secret-at-least-32-characters
          CREDENTIAL_ENCRYPTION_KEY=ci-credential-key-at-least-32-characters
          N8N_ENCRYPTION_KEY=ci-n8n-key-at-least-32-characters
          LISTMONK_ADMIN_PASSWORD=ci-listmonk-password
          EOF
          docker compose --env-file .env.ci config --quiet

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 180s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/fadereach

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            test -f .env

            docker compose --env-file .env config --quiet
            docker compose --env-file .env build --pull api worker frontend
            docker compose --env-file .env run --rm --no-deps api alembic upgrade head
            docker compose --env-file .env up -d --remove-orphans

            docker compose --env-file .env ps

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/api/health >/tmp/fadereach-health.json; then
                cat /tmp/fadereach-health.json
                exit 0
              fi
              sleep 5
            done

            docker compose --env-file .env ps
            docker compose --env-file .env logs --tail=100 api
            exit 1
