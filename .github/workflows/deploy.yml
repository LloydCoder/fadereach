name: FadeReach — Deploy to EC2 Stockholm

on:
  workflow_dispatch:

env:
  EC2_HOST: 13.50.16.19
  EC2_USER: ubuntu
  APP_DIR:  /opt/fadereach

jobs:
  deploy:
    name: Deploy Phase 1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (verify syntax)
        working-directory: backend
        run: |
          pip install -r requirements.txt --quiet
          python -m py_compile main.py
          echo "✓ Backend syntax OK"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ env.EC2_HOST }}
          username:    ${{ env.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          timeout:     120s
          script: |
            set -e
            echo "── Pulling latest code ──"
            cd ${{ env.APP_DIR }}
            git pull origin main

            echo "── Installing Python deps ──"
            cd backend
            pip install -r requirements.txt --quiet --break-system-packages

            echo "── Restarting FadeReach API ──"
            sudo systemctl restart fadereach-api
            sleep 3

            echo "── Health check ──"
            curl -sf http://localhost:8001/api/health | python3 -m json.tool
            echo "✓ FadeReach API deployed successfully"

      - name: Notify deployment
        if: success()
        run: |
          curl -s -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{
              "text": "✅ *FadeReach deployed* to fadereach.tinlance.com\nCommit: `${{ github.sha }}`\nBy: ${{ github.actor }}"
            }' || true

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{
              "text": "❌ *FadeReach deploy FAILED*\nCommit: `${{ github.sha }}`\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions"
            }' || true
